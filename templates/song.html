<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — {{ artist }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="song-page">

<header class="topbar slim">
  <a href="/" class="logo">Lyricly</a>
  <a href="javascript:history.back()" class="back">← Back to results</a>
</header>

<main class="song">
  <h1 class="song-title">{{ title or '(untitled)' }}</h1>
  <div class="song-meta">
    {% if artist %}<span>Artist: <b>{{ artist }}</b></span>{% endif %}
    {% if year   %}<span>Year: <b>{{ year }}</b></span>{% endif %}
    {% if rank   %}<span>Rank: <b>{{ rank }}</b></span>{% endif %}
  </div>
  <pre class="song-lyrics">{{ lyrics }}</pre>
</main>

<footer class="foot">
  <span>Local index: Whoosh + BM25F over lyrics.csv</span>
</footer>

</body>
</html>
